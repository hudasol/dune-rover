name: ci
on:
  push:
  pull_request:
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No source PDFs, raw data or oversize files (tree and full history)
        run: |
          python scripts/check_repo_hygiene.py
          python scripts/check_repo_hygiene.py --history
      - name: Secrets scan (tree and full history)
        run: python scripts/scan_secrets.py --history
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy matplotlib tifffile imagecodecs scikit-learn pytest
      - run: PYTHONPATH=src python -m pytest -q tests
  generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy matplotlib
      - name: Generated files match their sources (README, report, brief, EDGE proposal, evidence table, verification log)
        run: |
          python scripts/consolidate_evidence.py
          python scripts/verify_stats.py
          PYTHONPATH=src python scripts/build_report.py
          git diff --ignore-cr-at-eol --exit-code -- README.md docs/REPORT.md docs/EXECUTIVE_BRIEF.md docs/PROPOSAL_EDGE.md docs/PROPOSAL_ROBOTICS.md docs/COMPLETENESS.md research/
      - name: Manuscript matches its sources and every hand typed number is justified
        run: |
          PYTHONPATH=src python scripts/build_manuscript.py --strict
          git diff --ignore-cr-at-eol --exit-code -- manuscript/MANUSCRIPT.md
          python scripts/check_manuscript_numbers.py
      - name: Every number in the manuscript, brief and proposals is traced in the number ledger
        run: PYTHONPATH=src python scripts/build_number_ledger.py --check
      - name: The planner's evidence card matches the result files
        run: PYTHONPATH=src python scripts/build_evidence_card.py --check
      - name: Writing rules (no dash characters, no banned names)
        run: |
          python - <<'PY'
          import subprocess, sys
          bad = []
          for f in subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split():
              if not f.endswith((".md", ".py", ".csv", ".txt", ".json", ".yml")) or f == "scripts/scan_secrets.py":
                  continue
              t = open(f, encoding="utf-8", errors="ignore").read()
              for w in (chr(0x2014), chr(0x2013), "Stir" + "ling", "Clau" + "de"):
                  if w in t:
                      bad.append((f, repr(w)))
          print("\n".join(f"{f}: {w}" for f, w in bad) or "writing check: ok")
          sys.exit(1 if bad else 0)
          PY
