[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dunerover"
version = "0.1.0"
description = "Slope-and-slip traversability study on open Copernicus DEM data (simulation only, model-assumption dependent)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "tifffile", "imagecodecs"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
